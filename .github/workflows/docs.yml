name: Docs

# copied and adapted from https://fsprojects.github.io/FSharp.Formatting/zero-to-hero.html#Ship-it

# Build the docs on pull requests too, so that errors from 'fsdocs build --strict' show up before merging.
# Only pushes to the main branch deploy them.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

# Make sure only one documentation build/deploy runs at a time.
# New pushes to main cancel any in-progress run to avoid concurrent deployments.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Git Checkout source code
        uses: actions/checkout@v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json

      - name: Restore dotnet tools
        run: dotnet tool restore

      - name: Run combineIntoOneFile.fsx
        # Run it once before building all target frameworks in parallel below, see build.yml
        run: dotnet fsi combineIntoOneFile.fsx

      - name: Build code to make xml file
        run: dotnet build ForPublishing.fsproj -c Release  # see required xml tags: https://fsprojects.github.io/FSharp.Formatting/zero-to-hero.html#Generating-API-documentation

      - name: copy README.md to Docs/index.md
        run: cp README.md Docs/index.md

      - name: Generate the documentation html
        # for this to work in dotnet-tools.json, rollForward must be set to 'false' for fsdocs-tool
        run: dotnet fsdocs build --clean --strict --properties Configuration=Release --input Docs --output DocsGenerated

      - name: Upload documentation html files
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./DocsGenerated

  # GitHub Actions recommends deploying in a separate job.
  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: build
    # We need these permissions to publish to Github Pages
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json

      - name: Run dotnet build ForEditing
        run: |
          dotnet build ForEditing.fsproj 

      - name: Run combineIntoOneFile.fsx
        # Run it once before building all target frameworks in parallel below.
        # The parallel builds run it again, but then find the combined file unchanged and don't race writing to it.
        run: |
          dotnet fsi combineIntoOneFile.fsx

      - name: Check that the combined file in git is up to date
        shell: bash
        run: |
          git diff --exit-code --stat -- Src/AutoGeneratedCode/ || { echo "::error::Src/AutoGeneratedCode is out of date. Run 'dotnet fsi combineIntoOneFile.fsx' and commit the result."; exit 1; }

      - name: Run dotnet build ForPublishing
        run: |
          dotnet build ForPublishing.fsproj -c Release


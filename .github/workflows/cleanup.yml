# https://github.com/marketplace/actions/delete-workflow-runs
name: Delete old workflow runs
on:
  schedule:
    - cron: "0 4 * * 1" # Weekly on Monday at 04:00
  # to allow manual triggering of the workflow from the GitHub Actions tab:
  workflow_dispatch:

jobs:
  delete-runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      # delete_workflow_pattern matches case-insensitive substrings of the workflow name or file name.
      # Successful releaseNuget.yml runs are never deleted, they record what was published to nuget.org.

      - name: Delete all successful runs of dependabot and cleanup
        uses: Mattraks/delete-workflow-runs@v2.1.0
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: dependabot|cleanup.yml
          retain_days: 0
          keep_minimum_runs: 0
          delete_run_by_conclusion_pattern: success

      - name: Delete all but the last successful run of build, docs and checkLinks
        # the last build and docs runs are kept for the badges in the readme
        uses: Mattraks/delete-workflow-runs@v2.1.0
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: build.yml|docs.yml|checkLinks.yml
          retain_days: 0
          keep_minimum_runs: 1
          delete_run_by_conclusion_pattern: success

      - name: Delete all failed runs older than 30 days
        uses: Mattraks/delete-workflow-runs@v2.1.0
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 30
          keep_minimum_runs: 0
